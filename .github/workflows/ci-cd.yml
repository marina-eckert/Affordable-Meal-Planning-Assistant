name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build frontend image
      run: |
        docker build -t frontend:latest ./mp-assistant

    - name: Build backend image
      run: |
        docker build -t backend:latest ./backend/src/MPA.API

    - name: Save frontend image and send to VM
      run: |
        docker save frontend:latest | ssh -i ${{ secrets.VM_KEY }} ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "docker load"

    - name: Save backend image and send to VM
      run: |
        docker save backend:latest | ssh -i ${{ secrets.VM_KEY }} ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "docker load"

    - name: Deploy with docker-compose
      run: |
        ssh -i ${{ secrets.VM_KEY }} ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
        "cd ~/Affordable-Meal-Planning-Assistant && docker-compose up -d"
